name: Build Windows app

on:
  push:
    branches: [main, 'check/**']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist
          ls -la dist
          cp dist/NRRL-Billing-Setup-*.exe ../NRRL-Billing-Setup.exe

      - name: Check the database works inside the app
        run: |
          cat > smoke.js <<'JS'
          const { app } = require('electron');
          app.whenReady().then(() => {
            try {
              const { Store } = require('./db');
              const s = new Store(require('path').join(app.getPath('temp'), 'nrrl-smoke.db'));
              s.saveItem({ code: 'T1', name: 'Test', retail: 10, stock: 5 });
              const b = s.saveBill({ lines: [{ code: 'T1', qty: 2 }] });
              require('./print').barcodeImage('NR10001', s.getSettings()).then(bc => {
                console.log('SMOKE OK total=' + b.total + ' bar=' + bc.dots);
                if (!(b.total === 20 && bc.dots >= 2)) return app.exit(1);
                // the direct label path must reach the Windows spooler: a missing printer must give a clear error
                return require('./print').printLabelsDirect([{ item: { code: 'NR10001', name: 'Test', retail: 10 }, count: 1 }], { ...s.getSettings(), label_printer: 'No Such Printer 123' })
                  .then(() => { console.error('RAW: unexpected success'); app.exit(1); })
                  .catch(e => { console.log('RAW error text: ' + e.message); app.exit(/Cannot open printer/.test(e.message) ? 0 : 1); });
              }).catch(e => { console.error('SMOKE FAIL', e); app.exit(1); });
            } catch (e) { console.error('SMOKE FAIL', e); app.exit(1); }
          });
          JS
          npx electron smoke.js

      - name: Open the whole app, visit every screen, make a bill, PDF, return and purchase
        env:
          NRRL_SELFTEST: '1'
          NRRL_DATA_DIR: ${{ runner.temp }}/nrrl-selftest
        run: |
          npx electron . 2>&1 | tee selftest.log
          grep -q "SELFTEST OK" selftest.log

      - name: Install quietly, open the installed app, then update over it (what "Update now" does)
        shell: pwsh
        working-directory: .
        env:
          NRRL_DATA_DIR: ${{ runner.temp }}/nrrl-installed
        run: |
          "Installer size: {0:N1} MB" -f ((Get-Item .\NRRL-Billing-Setup.exe).Length / 1MB)
          $p = Start-Process -FilePath .\NRRL-Billing-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "install exit $($p.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'NRRL Billing.exe' | Select-Object -First 1
          if (!$exe) { Write-Error 'app not installed'; exit 1 }
          "Installed: $($exe.FullName)"
          $env:NRRL_SELFTEST = '1'
          $a = Start-Process -FilePath $exe.FullName -Wait -PassThru
          if ($a.ExitCode -ne 0) { Write-Error "installed app self-test failed ($($a.ExitCode))"; exit 1 }
          "Installed app self-test OK"
          Remove-Item Env:NRRL_SELFTEST
          $before = (Get-Item $exe.FullName).LastWriteTimeUtc
          $p = Start-Process -FilePath .\NRRL-Billing-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "update exit $($p.ExitCode)"; exit 1 }
          if (!(Test-Path $exe.FullName)) { Write-Error 'app missing after update'; exit 1 }
          "Quiet update over the installed app OK"

      - uses: actions/upload-artifact@v4
        with:
          name: nrrl-billing-windows
          path: NRRL-Billing-Setup.exe

      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          V=$(node -p "require('./desktop/package.json').version")
          # the app reads "Version: x.y.z" from these notes to tell people a new version is ready
          printf "Download NRRL-Billing-Setup.exe and run it. If Windows shows 'Windows protected your PC', click More info → Run anyway.\n\nVersion: %s\n" "$V" > notes.txt
          gh release create desktop-latest NRRL-Billing-Setup.exe --title "NRRL Billing for Windows $V" --notes-file notes.txt
