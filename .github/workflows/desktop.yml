name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist
          ls -la dist
          cp dist/NRRL-Billing-Setup-*.exe ../NRRL-Billing-Setup.exe

      - name: Check the database works inside the app
        run: |
          cat > smoke.js <<'JS'
          const { app } = require('electron');
          app.whenReady().then(() => {
            try {
              const { Store } = require('./db');
              const s = new Store(require('path').join(app.getPath('temp'), 'nrrl-smoke.db'));
              s.saveItem({ code: 'T1', name: 'Test', retail: 10, stock: 5 });
              const b = s.saveBill({ lines: [{ code: 'T1', qty: 2 }] });
              require('./print').barcodeImage('NR10001', s.getSettings()).then(bc => {
                console.log('SMOKE OK total=' + b.total + ' bar=' + bc.dots);
                app.exit(b.total === 20 && bc.dots >= 2 ? 0 : 1);
              }).catch(e => { console.error('SMOKE FAIL', e); app.exit(1); });
            } catch (e) { console.error('SMOKE FAIL', e); app.exit(1); }
          });
          JS
          npx electron smoke.js

      - uses: actions/upload-artifact@v4
        with:
          name: nrrl-billing-windows
          path: NRRL-Billing-Setup.exe

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest NRRL-Billing-Setup.exe --title "NRRL Billing for Windows (latest)" --notes "Download NRRL-Billing-Setup.exe and run it. If Windows shows 'Windows protected your PC', click More info → Run anyway."
