name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p shell/www
          cp index.html app.js manifest.webmanifest icon-192.png icon-512.png shell/www/
          # stamp this build's number into the app, so it can tell when a newer one is out
          sed -i 's/const APP_BUILD = 0;/const APP_BUILD = ${{ github.run_number }};/' shell/www/app.js
          grep -c "const APP_BUILD = ${{ github.run_number }};" shell/www/app.js
          # bundle the barcode library so scanning works without the CDN
          curl -sSL https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js -o shell/www/zxing.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js#zxing.min.js#' shell/www/index.html

      - name: Create Android project
        working-directory: shell
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor-mlkit/barcode-scanning@6.2.0 @capacitor/filesystem@6.0.3 @capacitor/share@6.0.3 jspdf@2.5.2 esbuild@0.24.0
          # faster scanning: the plugin waits for the same code in 10 camera frames before reporting it (up to 1-2 s on
          # older phones) and looks at a small 640x480 picture (small labels hard to read). Report after 3 frames and
          # look at a 720p picture instead.
          python3 - <<'PY'
          p = 'node_modules/@capacitor-mlkit/barcode-scanning/android/src/main/java/io/capawesome/capacitorjs/plugins/mlkit/barcodescanning/BarcodeScanner.java'
          s = open(p).read()
          a = 'if (votes >= 10) {'
          assert s.count(a) == 1, 'votes line changed'
          s = s.replace(a, 'if (votes >= 3) {')
          a = 'new ImageAnalysis.Builder().setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)'
          assert s.count(a) == 1, 'analysis line changed'
          s = s.replace(a, a + '.setTargetResolution(new android.util.Size(720, 1280))')
          open(p, 'w').write(s)
          print('patched ML Kit scanner')
          PY
          grep -n "votes >= \|setTargetResolution" node_modules/@capacitor-mlkit/barcode-scanning/android/src/main/java/io/capawesome/capacitorjs/plugins/mlkit/barcodescanning/BarcodeScanner.java
          # fast native barcode scanner (Google ML Kit) for the page
          cp ../native/entry.js native-entry.js; cp ../native/pdf-entry.js pdf-entry.js
          # target older Android WebViews too (Android 7+ with Chrome 61+): newer syntax is rewritten
          npx esbuild native-entry.js --bundle --format=iife --minify --target=chrome61 --outfile=www/native.js
          npx esbuild pdf-entry.js --bundle --format=iife --minify --target=chrome61 --outfile=www/pdf.js
          npx esbuild www/app.js --minify --target=chrome61 --allow-overwrite --outfile=www/app.js
          ls -la www
          sed -i 's#<script src="app.js" defer></script>#<script src="native.js"></script>\n<script src="app.js" defer></script>#' www/index.html
          grep -n "native.js" www/index.html
          npx cap init "NRRL Counter" in.nrrl.counter --web-dir www
          npx cap add android
          # camera permission for live barcode scanning
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.CAMERA" />#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          # the ML Kit plugin needs data binding
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace('android {', 'android {\n    buildFeatures {\n        dataBinding true\n    }', 1)
          open(p, 'w').write(s)
          PY
          grep -n "permission\|meta-data\|application" android/app/src/main/AndroidManifest.xml

      - name: App icon
        working-directory: shell
        run: |
          R=android/app/src/main/res
          cp -r ../android-icons/mipmap-* $R/
          sed -i 's#<color name="ic_launcher_background">.*</color>#<color name="ic_launcher_background">\#4a2fbd</color>#' $R/values/ic_launcher_background.xml || true

      - name: Signing key (private, from the repository secrets)
        working-directory: shell
        env:
          NRRL_KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NRRL_KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$NRRL_KS_PW" ] && [ -n "$NRRL_KS_B64" ]; then
            # private key: kept only in the repository secrets, written to the build machine for this build
            KS="$RUNNER_TEMP/nrrl-release.jks"; echo "$NRRL_KS_B64" | base64 -d > "$KS"; ALIAS=nrrl; PWEXPR='System.getenv("NRRL_KS_PW")'
            echo "::notice::Signing with the private release key"
          else
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets are missing. Not building with any other key."; exit 1
          fi
          python3 - "$KS" "$ALIAS" "$PWEXPR" <<'PY'
          import sys
          ks, alias, pw = sys.argv[1], sys.argv[2], sys.argv[3]
          p = 'android/app/build.gradle'
          s = open(p).read()
          cfg = ('    signingConfigs {\n        nrrl {\n            storeFile file("%s")\n            storePassword %s\n'
                 '            keyAlias "%s"\n            keyPassword %s\n        }\n    }\n' % (ks, pw, alias, pw))
          s = s.replace('    buildTypes {', cfg + '    buildTypes {\n        debug {\n            signingConfig signingConfigs.nrrl\n        }', 1)
          open(p, 'w').write(s)
          PY
          grep -n "signingConfig\|storeFile\|keyAlias" android/app/build.gradle

      - name: Build APK
        working-directory: shell
        env:
          NRRL_KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          report() { msg=$(tail -c 3500 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=$2::$msg"; exit 1; }
          npx cap sync android > sync.log 2>&1 || report sync.log "cap sync failed"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1 || report ../gradle.log "gradle failed"
          cp app/build/outputs/apk/debug/app-debug.apk ../../nrrl-counter.apk
          # show which key signed it
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs ../../nrrl-counter.apk | grep -i "SHA-256" | head -1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: nrrl-counter-apk
          path: nrrl-counter.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          # the app reads "Build: N" from these notes to tell people a new version is ready
          printf "Install on Android: download nrrl-counter.apk and open it. Allow 'Install unknown apps' if asked.\n\nBuild: %s\n" "${{ github.run_number }}" > notes.txt
          gh release create latest nrrl-counter.apk --title "NRRL Counter build ${{ github.run_number }}" --notes-file notes.txt
